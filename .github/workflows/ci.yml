name: ci
on:
  # Pull requests into main only: theirs never has main's own commit as its head, so a pull request's `checks`, which
  # skips the jobs held back from it (below), never lands on a commit of main that staging-migrations.yml trusts.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue's build of a pull request on top of main and the pull requests ahead of it: main's ruleset
  # requires `checks` there too, and the queue lands the pull request only when it passes.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # superseded pushes stop burning the stack spin-ups

# Three jobs run at once, each on a fresh runner and local stack: the quick checks, the whole suite, and the
# four-runs-at-once test alone. A pull request runs only the quick checks: the Mac's gate ran the whole suite on its
# head (with Docker; a pass without it skips the database tests), and the merge queue's build, on top of main and the pull requests ahead of it, runs all three before
# it lands (a push to main runs all three again). The required check is the `checks` job, which waits for all three
# and passes only when every one passed, or, on a pull request only, was held back from it (a done rule,
# scripts/done-gate/ci-jobs.ts, refuses a ci.yml where it could pass otherwise).
jobs:
  # Everything but the whole suite, so a failing check shows in minutes.
  quick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions SHA-pinned (AGENTS.md → Conventions; docs/security.md S12): mutable tags are supply-chain surface
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Secret scan first, for fail-fast (docs/security.md S9.3): the gitleaks program itself, pinned by version and
      # checksum (the gitleaks action needs a paid licence in an organization's repository), over the commits this run
      # brings: a pull request's since it left its base, a push's since the commit before it. It reads .gitleaks.toml
      # and .gitleaksignore from the checkout.
      - name: Secret scan (gitleaks 8.30.1)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..{1}', github.base_ref, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="$RANGE" .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11" # pinned to the Bun engine (AGENTS.md → Conventions)

      - run: bun install --frozen-lockfile

      - run: bun audit # dependency audit (docs/tech-stack.md T14, docs/security.md S12.1)

      - run: bun run lint # includes G1 restricted-imports

      # The done rules (no throwing stubs, no export nothing calls, no skipped test...) on this PR's whole
      # change, so they bind every agent and human, not only agents whose stop hook runs them.
      # fetch-depth 0 above fetches every branch, so origin/<base> exists. The pull request's own commit is judged
      # against where it left the base, as rules-from-main and an agent's stop judge it, not GitHub's merge commit:
      # a removed expect line is then named by the same line number in all three (docs/removed-tests.md). In the merge
      # queue's build (no base_ref) the base is main, so here and in the two checks below the change judged is this
      # pull request's together with those queued ahead of it, each of which passed them on its own.
      - name: Done rules (scripts/done-gate.ts)
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run gate rules --base "$BASE" --head "$HEAD_SHA"

      - run: bun run typecheck

      - name: Console build (dummy env) + guards (scripts/guards/) # docs/security.md S1.2, S4.1 and S7.3; docs/patterns excerpts
        run: |
          VITE_SUPABASE_URL="https://dummy.invalid" VITE_SUPABASE_ANON_KEY="dummy-not-a-key" \
            bun run --filter console build
          bun run guards

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch tip 2026-07-11
        with:
          version: 2.109.1 # pin the whole toolchain, CLI included (AGENTS.md → Conventions)

      # Only the database, sign-in, data interface and gateway, failing unless exactly those run; then the tests' settings.
      - name: Start local Supabase stack
        run: bash .github/test-stack.sh

      # The pull request's new and edited tests must fail on main's code and pass on its own (scripts/done-gate/tests-proven.ts),
      # here on a fresh database that no whole-suite run has filled. It judges the checkout as it stands, so files this job
      # made (a build's output, say), which are never the pull request's (its files are all committed), are ignored
      # for it first, or they would count as product code.
      - name: Tests proven against main's code
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          git ls-files --others --exclude-standard >> .git/info/exclude
          bun run gate proven --base "$BASE"

      # Each new line of guardrail, tenancy and money code, broken on purpose (a condition flipped, a statement
      # removed), must make a test fail (scripts/done-gate/break-check.ts); a test file that fails alone fails it too.
      # The step above already ignores the job's files.
      - name: Break check on guardrail, tenancy and money code
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: bun run gate broken --base "$BASE"

      - run: bun run rls:check
        env:
          LOCAL_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      # Console sign-in e2e against the real local stack: the wrapper exports the stack env, Playwright
      # starts the worker + a console build (dist-e2e, never the guarded dist/), and the spec seeds its own data.
      # pw:webserver prints what those servers say, so one that fails to start says why.
      - name: Console e2e (real local stack)
        env:
          DEBUG: pw:webserver
        run: |
          bunx playwright install --with-deps chromium
          bun run local bun run gate tests e2e

      # Labelled with the commit it is built from, which the step then reads back from the image.
      - name: Build worker image (build only; deploy is .github/workflows/deploy.yml) # docs/tech-stack.md T14
        env:
          RELEASE: ${{ github.sha }}
        run: |
          docker build --build-arg RELEASE="$RELEASE" -f docker/Dockerfile -t revenue-os-worker:ci .
          label="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' revenue-os-worker:ci)"
          test "$label" = "$RELEASE" || { echo "the image is labelled \"$label\", not $RELEASE"; exit 1; }
          # A build that names no commit must fail, so no image goes out unlabelled (it reuses the layers above).
          if docker build -f docker/Dockerfile -t revenue-os-worker:no-commit . ; then
            echo "an image built without RELEASE was accepted"; exit 1
          fi

  # The whole suite, alone on its own fresh database, as the Mac's gate runs it: every test but the four-runs-at-once
  # test, left out by its path, with the skipped-test and coverage checks. Held back from pull requests.
  suite:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the coverage check compares the change with origin/<base>

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch tip 2026-07-11
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: bash .github/test-stack.sh

      # Every test must run: a skipped or todo test fails, however it was switched off (scripts/done-gate/tests-ran.ts, MAY_SKIP).
      - run: bun run gate tests --leave-at-once-to-ci

  # The four-runs-at-once test alone on its own fresh stack: four whole-suite runs and a demo started together, which
  # must all pass and leave others' data alone. It fails unless that one test ran and passed; it runs no product line
  # in its own process, so it has no coverage check. Held back from pull requests.
  at-once:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the suites it starts hold tests that read origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch tip 2026-07-11
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: bash .github/test-stack.sh

      - run: bun run gate tests --at-once-alone

  # The required check: it waits for all three jobs, even when one fails, and passes only when every one passed, or,
  # on a pull request only, was skipped as held back from it.
  checks:
    needs: [quick, suite, at-once]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job it waits for passed, or on a pull request was held back from it
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          HELD_BACK: ${{ github.event_name == 'pull_request' && 'skipped' || 'none' }}
        run: for r in $RESULTS; do test "$r" = success || test "$r" = "$HELD_BACK" || { echo "a job checks waits for ended $r ($RESULTS)"; exit 1; }; done
