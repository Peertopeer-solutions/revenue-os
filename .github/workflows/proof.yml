name: proof
# Each slice's proof (`bun run proof <slice>`, scripts/proof/) runs here against the real product: Slices 0 and 1
# against the local stack this job starts, as ci.yml starts it; from Slice 2 on, the test server and the test phone
# numbers the system controls. It runs for every slice ROADMAP.md marks `proof ready` or `done`:
#   - after each deploy to main: when deploy.yml finishes on a push to main. It follows deploy, not ci, because from
#     Slice 2 on deploy is what puts the commit on the test server; until then deploy's jobs are switched off and
#     its runs end "skipped", which counts as deployed. A failed or cancelled deploy proves nothing.
#   - once a day, on main's newest commit;
#   - by hand: Actions → proof → Run workflow (on main), naming one slice, whatever its status.
# `workflow_run` and `schedule` always run main's copy of this file. Never on a pull request.
#
# Each slice is a job of its own, named `proof (<n>)`. Its step "Every step passed" runs only when every step
# passed: a slice whose other steps only wait on Devesh still ends green, so that step is what tells passed from
# waiting. scripts/done-gate/proof-run.ts reads a run that way, for `bun run cycle --banner` and for rules-from-main,
# which lets a pull request set a slice to done only with a passing run's link. Each slice's report folder is kept
# as the run's artifact (for the repository's retention period, 90 days by default), and its report's text is posted
# as a comment on the one standing issue "Proof reports", which mentions Devesh so GitHub notifies him of each one.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Proof of Slice {0}', inputs.slice) || format('Proof of every proof-ready or done slice ({0})', github.event_name) }}
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 3 * * *" # 03:23 UTC, 08:53 in India
  workflow_dispatch:
    inputs:
      slice:
        description: "The slice to prove, by its number"
        required: true
        type: string

permissions: {}

jobs:
  due:
    # A push to main that deploy finished (or skipped), the daily run, or a run by hand on main.
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && contains(fromJSON('["success","skipped"]'), github.event.workflow_run.conclusion))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slices: ${{ steps.due.outputs.slices }}
    steps:
      # Actions SHA-pinned (AGENTS.md → Conventions), as in ci.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11" # pinned to the Bun engine (AGENTS.md → Conventions)

      - name: Which slices to prove
        id: due
        env:
          SLICE: ${{ inputs.slice }}
        # The path in quotes, as an import writes it, so the gate counts due.ts as product code this runs.
        run: bun "scripts/proof/due.ts"

  proof:
    needs: due
    if: needs.due.outputs.slices != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the steps stop at 100 minutes (scripts/proof/run.ts RUN_MINUTES), so the report is always written
    permissions:
      contents: read
      actions: read # a step may read GitHub's run records (Slice 0's proof reads staging-migrations' and ci's runs)
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.due.outputs.slices) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # steps compare with main, as the gate does
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch tip 2026-07-11
        if: matrix.slice <= 1
        with:
          version: 2.109.1 # as ci.yml

      # As ci.yml: only the database, sign-in, data interface and gateway, failing unless exactly those run; then the
      # settings the proof's steps read.
      - name: Start local Supabase stack
        if: matrix.slice <= 1
        run: bash .github/test-stack.sh

      # No AI model runs here: Slice 0's two AI steps run on Devesh's Mac, and this run reads their committed record
      # (scripts/done-gate/mac-record.ts). Exit 1 only when a step failed; `result` says passed, waiting or failed.
      - name: Prove the slice
        id: prove
        env:
          SLICE: ${{ matrix.slice }}
          GH_TOKEN: ${{ github.token }}
        run: bun run proof "$SLICE" --out "proof-report/slice-$SLICE"

      - name: Every step passed
        if: steps.prove.outputs.result == 'passed'
        run: echo "Every step of this slice passed."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: proof-slice-${{ matrix.slice }}
          path: proof-report

  post:
    needs: [due, proof]
    if: always() && needs.due.result == 'success' && needs.due.outputs.slices != '[]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Every slice's files land in reports/slice-<n>/: each artifact holds its slice's folder, and merging them
      # gives that one layout whatever their number (unmerged, a lone artifact is unpacked straight into reports/,
      # which posted Slice 0's first report as "stopped before it wrote a report").
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # a slice whose job wrote no report is posted as stopped below
        with:
          pattern: proof-slice-*
          path: reports
          merge-multiple: true

      # No concurrency group: GitHub keeps one waiting run per group and cancels the rest, which would lose reports.
      # The oldest issue of that title is the standing one; it is made once, mentioning the repository's owner. A
      # report that can't be posted fails the step only after the other slices' reports are posted.
      - name: Post each slice's report to the "Proof reports" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLICES: ${{ needs.due.outputs.slices }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          issue="$(gh issue list --state all --limit 1000 --json number,title --jq '[.[] | select(.title == "Proof reports") | .number] | min // empty')"
          if [ -z "$issue" ]; then
            url="$(gh issue create --title "Proof reports" --body "Each run of the proof workflow (.github/workflows/proof.yml) posts its short report here as a comment. @${OWNER}: this mention subscribes you, so GitHub notifies you of every report.")"
            issue="${url##*/}"
          fi
          for n in $(printf '%s' "$SLICES" | tr -d '[] ' | tr ',' ' '); do
            report="reports/slice-$n/report.md"
            if [ ! -f "$report" ]; then
              report="stopped-$n.md"
              printf '## Proof report: Slice %s — failed\nRun: %s\n\nThe proof job stopped before it wrote a report; the run'"'"'s log says why.\n' "$n" "$RUN_URL" > "$report"
            fi
            gh issue comment "$issue" --body-file "$report" || { echo "::error::Slice $n's report was not posted"; unposted=1; }
          done
          exit "${unposted:-0}"
