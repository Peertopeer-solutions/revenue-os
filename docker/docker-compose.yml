services:
  worker:
    # RELEASE: the commit being built (`RELEASE=$(git rev-parse HEAD) docker compose build`), its label and /release.
    # Empty when unset, so logs, ps and down need none; docker/Dockerfile refuses a build that names no commit.
    build: { context: .., dockerfile: docker/Dockerfile, args: { RELEASE: "${RELEASE:-}" } }
    env_file: ../.env
    restart: unless-stopped
    # A stop or redeploy sends SIGTERM: the worker takes no new job and lets running ones finish for up to 60 s
    # (STOP_WAIT_MS in services/worker/src/jobs.ts). Docker waits this long before it kills it.
    stop_grace_period: 75s
    expose: ["8080"]
  caddy:
    image: caddy:2.11.4 # exact pin, as AGENTS.md → Conventions asks (was caddy:2 — the one floating tag in the stack)
    restart: unless-stopped
    # 443 only. Docker-published ports bypass ufw, so the PROVIDER firewall (Cloudflare ranges
    # only, runbook §0) is the wall. No 80: the origin cert means no ACME challenge to answer.
    ports: ["443:443"]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "./certs:/etc/caddy/certs:ro", "caddy_data:/data" ]
    # :? = refuse to start on a blank value (a blank secret would admit an empty X-Edge-Auth header).
    environment:
      - "API_HOST=${API_HOST:?run compose with --env-file ../.env}"
      - "EDGE_SHARED_SECRET=${EDGE_SHARED_SECRET:?run compose with --env-file ../.env}"
volumes: { caddy_data: {} }
